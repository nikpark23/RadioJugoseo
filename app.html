<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugoseo.com - Radio Online</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Nuestra hoja de estilos propia -->
  <link rel="stylesheet" href="css/styles.css">

  <script>
    // ---------------------------------------------------------
    // RF07 / protección de acceso: sin sesión, no se puede ver
    // esta página. Se ejecuta antes de pintar el contenido.
    // ---------------------------------------------------------
    if (!sessionStorage.getItem('jugoseoUsuario')) {
      window.location.replace('index.html');
    }
  </script>
</head>
<body class="jugoseo-shell-body">

  <!-- ===================== NAVBAR (fijo arriba) ===================== -->
  <nav class="navbar navbar-expand-lg navbar-dark jugoseo-navbar fixed-top">
    <div class="container">

      <a class="navbar-brand jugoseo-brand" href="#" onclick="cargarPagina('inicio'); return false;">
        JUGOSEO<span class="jugoseo-brand-dot">.com</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarJugoseo" aria-controls="navbarJugoseo"
              aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarJugoseo">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2" id="navLinks">
          <li class="nav-item">
            <a class="nav-link active" data-pagina="inicio" href="#" onclick="cargarPagina('inicio'); return false;">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-pagina="tienda" href="#" onclick="cargarPagina('tienda'); return false;">Tienda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-pagina="noticias" href="#" onclick="cargarPagina('noticias'); return false;">Noticias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-pagina="programas" href="#" onclick="cargarPagina('programas'); return false;">Programas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-pagina="contacto" href="#" onclick="cargarPagina('contacto'); return false;">Contacto</a>
          </li>
          <li class="nav-item d-none" id="navPanelAdmin">
            <a class="nav-link" href="admin.html">Panel Admin</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <span class="jugoseo-usuario-conectado d-none d-md-inline" id="saludoUsuario"></span>
          <button type="button" class="btn btn-outline-light btn-sm" id="btnCerrarSesion">Cerrar sesión</button>
        </div>

      </div>
    </div>
  </nav>


  <!-- ===================== ZONA FLEXIBLE: iframe ===================== -->
  <div class="jugoseo-app-content">

  <!-- ===================== CONTENIDO (iframe, cambia sin recargar el audio) ===================== -->
  <div class="jugoseo-frame-wrap">
    <iframe id="contentFrame" name="contentFrame" src="inicio.html" title="Contenido"></iframe>
  </div>

  </div>
  <!-- fin .jugoseo-app-content -->

  <!-- ===================== REPRODUCTOR FIJO (fixed-bottom) ===================== -->
  <div class="jugoseo-player fixed-bottom d-flex align-items-center gap-3">

    <div class="jugoseo-player-cover"></div>

    <div class="jugoseo-player-info d-none d-sm-block" style="min-width: 140px;">
      <div class="titulo"><span class="jugoseo-live-dot"></span>Jugoseo en vivo</div>
      <div class="subtitulo" id="estadoPlayer">Pausado</div>
    </div>

    <button type="button" class="jugoseo-btn-play" id="btnPlay" aria-label="Reproducir">
      <svg id="iconoPlay" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 2.5v11l9-5.5-9-5.5Z"/>
      </svg>
      <svg id="iconoPause" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:none;">
        <path d="M4 2.5h3v11H4v-11Zm5 0h3v11H9v-11Z"/>
      </svg>
    </button>

    <div class="d-none d-md-flex align-items-center gap-2 ms-auto">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--jugoseo-texto-tenue);">
        <path d="M9 4 5.5 6.5H3v3h2.5L9 12V4Z"/>
        <path d="M11 6.2a2.5 2.5 0 0 1 0 3.6" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </svg>
      <input type="range" class="form-range jugoseo-volume" id="volumen" min="0" max="1" step="0.01" value="0.8">
    </div>

    <!-- Reemplaza el src por el stream real de la radio -->
    <audio id="audioRadio" preload="none">
      <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
      Tu navegador no soporta audio HTML5.
    </audio>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ---------------------------------------------------------
    // Saludo con el usuario conectado + cerrar sesión
    // ---------------------------------------------------------
    const sesion = JSON.parse(sessionStorage.getItem('jugoseoUsuario') || 'null');
    if (sesion) {
      document.getElementById('saludoUsuario').textContent = `Hola, ${sesion.usuario}`;
      if (sesion.rol === 'Administrador') {
        document.getElementById('navPanelAdmin').classList.remove('d-none');
      }
    }
    document.getElementById('btnCerrarSesion').addEventListener('click', () => {
      sessionStorage.removeItem('jugoseoUsuario');
      window.location.href = 'index.html';
    });

    // ---------------------------------------------------------
    // Navegación entre secciones SIN recargar la página completa
    // (el <audio> vive en app.html, así que nunca se reinicia)
    // ---------------------------------------------------------
    function cargarPagina(nombre) {
      document.getElementById('contentFrame').src =nombre + '.html';

      document.querySelectorAll('#navLinks .nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.pagina === nombre);
      });

      const menuColapsado = document.getElementById('navbarJugoseo');
      if (menuColapsado.classList.contains('show')) {
        bootstrap.Collapse.getOrCreateInstance(menuColapsado).hide();
      }
    }

    // ---------------------------------------------------------
    // Reproductor de radio (play/pause + volumen)
    // ---------------------------------------------------------
    const audio = document.getElementById('audioRadio');
    const btnPlay = document.getElementById('btnPlay');
    const iconoPlay = document.getElementById('iconoPlay');
    const iconoPause = document.getElementById('iconoPause');
    const estadoPlayer = document.getElementById('estadoPlayer');
    const volumen = document.getElementById('volumen');

    audio.volume = volumen.value;

    btnPlay.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {
          estadoPlayer.textContent = 'No se pudo conectar';
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('playing', () => {
      iconoPlay.style.display = 'none';
      iconoPause.style.display = 'inline';
      estadoPlayer.textContent = 'Transmitiendo en vivo';
    });

    audio.addEventListener('pause', () => {
      iconoPlay.style.display = 'inline';
      iconoPause.style.display = 'none';
      estadoPlayer.textContent = 'Pausado';
    });

    audio.addEventListener('waiting', () => {
      estadoPlayer.textContent = 'Conectando...';
    });

    volumen.addEventListener('input', () => {
      audio.volume = volumen.value;
    });
  </script>

</body>
</html>
