<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Jugoseo.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="jugoseo-fondo-oscuro-2">

  <section class="pagina-interna">
    <div class="container" style="max-width: 640px;">

      <h1 class="pagina-titulo h3 mb-1">Únete a Jugoseo</h1>
      <p class="mb-4" style="color: var(--jugoseo-texto-tenue);">
        Regístrate como Socio VIP o Radioescucha Oficial y accede a beneficios exclusivos.
      </p>

      <form id="formRegistro" novalidate>

        <div class="row g-3">
          <div class="col-md-6">
            <label for="regNombre" class="form-label jugoseo-form-label">Nombre</label>
            <input type="text" class="form-control jugoseo-input" id="regNombre" required>
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>
          <div class="col-md-6">
            <label for="regApellido" class="form-label jugoseo-form-label">Apellido</label>
            <input type="text" class="form-control jugoseo-input" id="regApellido" required>
            <div class="invalid-feedback">El apellido es obligatorio.</div>
          </div>
        </div>

        <div class="mt-3">
          <label for="regCorreo" class="form-label jugoseo-form-label">Correo electrónico</label>
          <input type="email" class="form-control jugoseo-input" id="regCorreo" placeholder="tu@correo.com" required>
          <div class="invalid-feedback">Ingresa un correo válido.</div>
        </div>

        <div class="mt-3">
          <label for="regRun" class="form-label jugoseo-form-label">RUN (sin puntos ni guion, ej: 12345678K)</label>
          <input type="text" class="form-control jugoseo-input" id="regRun" maxlength="9" placeholder="12345678K" required>
          <div class="invalid-feedback">RUN inválido.</div>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label for="regRegion" class="form-label jugoseo-form-label">Región</label>
            <select class="form-select jugoseo-input" id="regRegion" required>
              <option value="" selected disabled>Selecciona una región</option>
            </select>
            <div class="invalid-feedback">Selecciona tu región.</div>
          </div>
          <div class="col-md-6">
            <label for="regComuna" class="form-label jugoseo-form-label">Comuna</label>
            <select class="form-select jugoseo-input" id="regComuna" required disabled>
              <option value="" selected disabled>Primero elige una región</option>
            </select>
            <div class="invalid-feedback">Selecciona tu comuna.</div>
          </div>
        </div>

        <div class="mt-4">
          <label class="form-label jugoseo-form-label d-block">Tipo de registro</label>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tipoSocio" id="tipoVip" value="Socio VIP">
            <label class="form-check-label" for="tipoVip">Socio VIP</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tipoSocio" id="tipoOficial" value="Radioescucha Oficial">
            <label class="form-check-label" for="tipoOficial">Radioescucha Oficial</label>
          </div>

          <div id="errorTipoSocio" class="jugoseo-form-error d-none mt-1">
            Selecciona un tipo de registro.
          </div>
        </div>

        <button type="submit" class="btn jugoseo-btn-login w-100 mt-4">Crear cuenta</button>

      </form>

    </div>
  </section>

  <!-- Contenedor de notificaciones (RNF02) -->
  <div id="toastContenedor" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/registro.js"></script>

</body>
</html>
